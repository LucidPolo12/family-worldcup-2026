const TOP_SCORERS = ["Kylian Mbappé","Lionel Messi","Erling Haaland"];
function gbScore(gb){ if(!gb) return 0; let t=0; ["pick1","pick2","pick3"].forEach(function(k,i){ var pl=(gb[k]||"").trim(); if(!pl) return; var r=TOP_SCORERS.indexOf(pl)+1; if(r<1||r>3) return; var pos=i+1; if(pos===1&&r===1) t+=40; else if(pos===1) t+=10; else if(r===1) t+=20; else t+=10; }); return t; }
/* ---------- scoring (mirrors the app: total = matchPts + podium bonus + golden boot) ---------- */
function outcome(score, teams, adv){
  if(!score) return null; const h=score[0], a=score[1];
  if(h>a) return {winner:teams.h, loser:teams.a};
  if(a>h) return {winner:teams.a, loser:teams.h};
  if(adv==="H") return {winner:teams.h, loser:teams.a};
  if(adv==="A") return {winner:teams.a, loser:teams.h};
  return null;
}
function finalFour(){
  const f = outcome(DATA.finalResult, FINAL, DATA.finalAdv);
  const t = outcome(DATA.thirdResult, THIRD, DATA.thirdAdv);
  return { champion:f?f.winner:null, runnerup:f?f.loser:null, third:t?t.winner:null, fourth:t?t.loser:null };
}
function podiumBonus(p, ff){
  let b=0; const pod=p.podium||{};
  if(ff.champion && p.champ===ff.champion) b+=50;
  if(ff.runnerup && pod.run===ff.runnerup) b+=35;
  if(ff.third && pod.third===ff.third) b+=20;
  if(ff.fourth && pod.fourth===ff.fourth) b+=10;
  return b;
}
function climbOf(name){ try{ const pr=DATA.prevRanks.ranks[name], tr=DATA.ranksToday.ranks[name]; return (pr!=null&&tr!=null)?(pr-tr):0; }catch(e){ return 0; } }
function compute(){
  const ff = finalFour();
  let s = DATA.standings.map(p=>{ const gb=gbScore(p.goldenBoot||{}); return Object.assign({}, p, {bonus:podiumBonus(p,ff), gbPts:gb, total:(p.matchPts||0)+podiumBonus(p,ff)+gb, climb:climbOf(p.name)}); });
  s.sort((a,b)=> b.total-a.total || b.exact-a.exact || b.correct-a.correct || a.name.localeCompare(b.name));
  let rank=1; s.forEach((x,i)=>{ if(i>0 && x.total<s[i-1].total) rank=i+1; x.rank=rank; });
  return {ranked:s, ff:ff, complete: ff.champion!=null};
}

];
const FALLBACK = [
  {em:"\u{1F31F}", ti:"Heart of the Tournament", de:"Kept everyone smiling"},
  {em:"\u{1F981}", ti:"Boldest Predictor",       de:"Never played it safe"},
  {em:"\u{1F3AA}", ti:"Most Entertaining Picks", de:"The wildcard we love"},
  {em:"\u{1F525}", ti:"Never Gave Up",           de:"Fought to the whistle"},
  {em:"\u{1F9ED}", ti:"The Wildcard",            de:"Full of surprises"},
  {em:"\u{1F389}", ti:"MVP Superfan",            de:"Heart and soul of it all"},
];
function buildAwards(ranked){
  const out = {};
  const medals=[{em:"\u{1F3C6}",ti:"World Champion",de:"1st overall"},{em:"\u{1F948}",ti:"Runner-Up",de:"2nd overall"},{em:"\u{1F949}",ti:"Third Place",de:"3rd overall"}];
  ranked.slice(0,3).forEach((p,i)=>{ out[p.name]={em:medals[i].em,ti:medals[i].ti,de:medals[i].de,sub:p.total+" pts",player:p}; });
  const remaining=new Set(ranked.slice(3).map(p=>p.name)); const usedCats=new Set();
  while(remaining.size){
    let best=null;
    remaining.forEach(name=>{ const p=ranked.find(x=>x.name===name);
      CATS.forEach(c=>{ if(usedCats.has(c.key)) return; const v=c.val(p); if(v<=0) return;
        const fieldMax=Math.max.apply(null,ranked.map(x=>c.val(x))); const standout=fieldMax>0?v/fieldMax:0;
        const topRem=Math.max.apply(null,[...remaining].map(n=>c.val(ranked.find(x=>x.name===n)))); if(v<topRem) return;
        if(!best||standout>best.standout){ best={name,cat:c,standout,p}; } }); });
    if(!best) break;
    out[best.name]={em:best.cat.em,ti:best.cat.ti,de:best.cat.de,sub:best.cat.fmt(best.p),player:best.p};
    usedCats.add(best.cat.key); remaining.delete(best.name);
  }
  let fi=0; remaining.forEach(name=>{ const p=ranked.find(x=>x.name===name); const f=FALLBACK[fi++%FALLBACK.length];
    out[name]={em:f.em,ti:f.ti,de:f.de,sub:p.total+" pts",player:p}; });
  return out;
}

/* ---------- audio: synthesized musical score + SFX (no files) ---------- */
let AC=null, MASTER=null, MUSIC=null, SFX=null, muted=false;
function ensureAudio(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    MASTER=AC.createGain(); MASTER.gain.value=muted?0:0.9; MASTER.connect(AC.destination);
    MUSIC=AC.createGain(); MUSIC.gain.value=0.55; MUSIC.connect(MASTER);
    SFX=AC.createGain(); SFX.gain.value=0.9; SFX.connect(MASTER);
  }catch(e){ AC=null; } }
  if(AC && AC.state==="suspended") AC.resume();
  return AC;
}
function toggleMute(){ muted=!muted; if(MASTER) MASTER.gain.value=muted?0:0.9;
  const b=document.getElementById("muteBtn"); if(b) b.textContent=muted?"\u{1F507}":"\u{1F50A}"; }
function env(g,s,dur,peak,atk){ g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(peak,s+atk);
  g.gain.setValueAtTime(peak,s+Math.max(atk,dur*0.5)); g.gain.exponentialRampToValueAtTime(0.0006,s+dur); }
function voice(freq,t0,dur,type,peak,atk,dest){ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||"triangle"; o.frequency.value=freq; const s=AC.currentTime+t0;
  env(g,s,dur,peak==null?0.2:peak,atk==null?0.02:atk); o.connect(g); g.connect(dest||MUSIC); o.start(s); o.stop(s+dur+0.06); }
function chord(freqs,t0,dur,type,peak){ freqs.forEach(f=>voice(f,t0,dur,type,peak)); }
function noise(t0,dur,vol,freq,q,type,dest){ if(!AC) return; const n=AC.createBufferSource();
  const buf=AC.createBuffer(1,AC.sampleRate*Math.max(0.05,dur),AC.sampleRate); const dt=buf.getChannelData(0);
  for(let i=0;i<dt.length;i++) dt[i]=Math.random()*2-1; n.buffer=buf;
  const f=AC.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq||900; f.Q.value=q||0.8;
  const g=AC.createGain(); const s=AC.currentTime+t0; g.gain.setValueAtTime(0.0001,s);
  g.gain.linearRampToValueAtTime(vol||0.3,s+dur*0.25); g.gain.exponentialRampToValueAtTime(0.0005,s+dur);
  n.connect(f); f.connect(g); g.connect(dest||SFX); n.start(s); n.stop(s+dur+0.05); }
function timpani(freq,t0,vol){ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain(); o.type="sine"; o.frequency.value=freq||90;
  const s=AC.currentTime+t0; o.frequency.exponentialRampToValueAtTime((freq||90)*0.6,s+0.25);
  g.gain.setValueAtTime(vol||0.5,s); g.gain.exponentialRampToValueAtTime(0.0005,s+0.5); o.connect(g); g.connect(SFX); o.start(s); o.stop(s+0.55); }
function crash(t0){ noise(t0||0,1.6,0.5,6000,0.4,"highpass"); noise(t0||0,1.2,0.3,3000,0.5,"bandpass"); }
function chime(base){ ensureAudio(); voice(base,0,0.5,"triangle",0.3,0.01,SFX); voice(base*1.5,0.04,0.5,"triangle",0.2,0.01,SFX); }
function drumroll(dur){ ensureAudio(); noise(0,dur,0.28,190,0.7); }
function crowd(dur){ ensureAudio(); noise(0,dur||2.6,0.4,760,0.5); noise(0.1,(dur||2.6)-0.3,0.22,1700,0.4); }
function riser(dur){ if(!AC) return; const o=AC.createOscillator(),g=AC.createGain(); o.type="sawtooth";
  const s=AC.currentTime; o.frequency.setValueAtTime(180,s); o.frequency.exponentialRampToValueAtTime(1400,s+dur);
  g.gain.setValueAtTime(0.0001,s); g.gain.linearRampToValueAtTime(0.18,s+dur*0.8); g.gain.exponentialRampToValueAtTime(0.0006,s+dur+0.1);
  o.connect(g); g.connect(SFX); o.start(s); o.stop(s+dur+0.15); noise(0,dur,0.16,1200,0.3,"highpass"); }

const cv=document.getElementById("fx"), cx=cv.getContext("2d");
let P=[], W=0, H=0; const DPR=Math.min(2, window.devicePixelRatio||1);

const COLORS=["#ffd23f","#ffb300","#4ade80","#60a5fa","#f472b6","#ffffff","#f87171"]; let themeColors=null;
function confetti(n){ n=n||160; for(let i=0;i<n && P.length<700;i++){ P.push({x:Math.random()*W,y:-20*DPR,vx:(Math.random()-.5)*6*DPR,vy:(Math.random()*3+2)*DPR,g:0.12*DPR,s:(Math.random()*7+4)*DPR,c:(themeColors||COLORS)[Math.random()*(themeColors||COLORS).length|0],rot:Math.random()*6.28,vr:(Math.random()-.5)*.3,t:"c"}); } }
let confUntil=0; function confettiStream(ms){ confUntil=performance.now()+ms; }
let sparkleOn=false, flashOn=false;
function firework(x,y){ const c=COLORS[Math.random()*COLORS.length|0]; for(let i=0;i<46 && P.length<700;i++){ const a=Math.random()*6.28,sp=(Math.random()*4+2)*DPR; P.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.045*DPR,s:3*DPR,c:c,life:1,fade:0.016,t:"f"}); } }
function fireworksShow(ms){ const end=performance.now()+(ms||3000); const iv=setInterval(()=>{ if(performance.now()>end){ clearInterval(iv); return; } firework((0.15+Math.random()*0.7)*W,(0.12+Math.random()*0.4)*H); }, 360); }
function loop(){ cx.clearRect(0,0,W,H); const now=performance.now();
  if(now<confUntil && P.length<640) confetti(7);
  if(sparkleOn && P.length<520 && Math.random()<0.5){ P.push({x:Math.random()*W,y:H+8,vx:(Math.random()-.5)*.5*DPR,vy:-(Math.random()*1.1+.4)*DPR,g:-0.002*DPR,s:(Math.random()*2+1)*DPR,c:Math.random()<.5?"#ffd23f":"#ffffff",life:1,fade:0.006,t:"f"}); }
  if(flashOn && P.length<600 && Math.random()<0.14){ P.push({x:Math.random()*W,y:Math.random()*H*0.66,vx:0,vy:0,g:0,s:(Math.random()*3+3)*DPR,c:"#ffffff",life:1,fade:0.05,t:"f"}); }
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy;
    if(p.t==="c"){ p.rot+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore(); if(p.y>H+30) P.splice(i,1); }

let cancelAuto=false;
function startAutoScroll(){ cancelAuto=false; const startY=window.scrollY; const target=Math.max(0, document.body.scrollHeight-window.innerHeight); if(target-startY<40) return; const dur=7000, t0=performance.now();
  function step(now){ if(cancelAuto) return; const p=Math.min(1,(now-t0)/dur); const e=0.5-0.5*Math.cos(Math.PI*p); window.scrollTo(0, startY+(target-startY)*e); if(p<1) requestAnimationFrame(step); } requestAnimationFrame(step); }
["touchstart","wheel","keydown","pointerdown"].forEach(ev=>window.addEventListener(ev, ()=>{ cancelAuto=true; }, {passive:true}));
window.addEventListener("scroll", ()=>{ if(window.scrollY>160) removeMoreHint(); }, {passive:true});
let moreHintEl=null;
function showMoreHint(){ if(moreHintEl) return; moreHintEl=$("<div class='morehint'><span class='ch'>▾</span>more below</div>"); document.body.appendChild(moreHintEl); }
function removeMoreHint(){ if(moreHintEl){ moreHintEl.remove(); moreHintEl=null; } }

/* Bobblehead gallery — special thanks to Ewan (titles are a first draft, easy to change) */
const GALLERY=[
  {intro:true, title:"Special Thanks to Ewan", sub:"Creator of every bobblehead"},
  {img:"pops-bobblehead.jpg",   name:"Pops",   title:"Legendary MVP"},
  {duo:["nonna-bobblehead.jpg","nana-bobblehead.jpg"], name:"Nonna & Nana", title:"Special Grandmas' MVP"},
  {img:"nonno-bobblehead.jpg",  name:"Nonno",  title:"IT Department Chief"},
  {img:"boompa-bobblehead.jpg", name:"Boompa", title:"The Legend"},
  {img:"emrys-bobblehead.jpg",  name:"Emrys",  title:"Rising Star"},
  {img:"xavier-bobblehead.jpg", name:"Xavier", title:"The Maverick"},
  {img:"autumn-bobblehead.jpg", name:"Autumn", title:"The Firecracker"},
  {img:"river-bobblehead.jpg",  name:"River",  title:"The Natural"},
  {img:"ewan-bobblehead.jpg",   name:"Ewan",   title:"The Artist behind it all ✨"},
  {group:true, img:"family-motley-crew.jpg", name:"The Motley Crew", title:"See you next tournament!"}
];
let galIdx=0;
function buildGallery(){ const g=$("<div class='gal' id='gal'><button class='close'>×</button><div class='thanks'>🎭 Special Thanks to Ewan</div><div class='gcard'></div><div class='gnav'><button class='gprev'>‹</button><button class='gnext'>›</button></div><div class='gdots'></div></div>");
  g.querySelector(".close").addEventListener("click", closeGallery, {passive:true});
  g.querySelector(".gprev").addEventListener("click", ()=>{ galIdx=(galIdx-1+GALLERY.length)%GALLERY.length; renderGal(-1); }, {passive:true});
  g.querySelector(".gnext").addEventListener("click", ()=>{ galIdx=(galIdx+1)%GALLERY.length; renderGal(1); }, {passive:true});
  let sx=null; g.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; }, {passive:true});
  g.addEventListener("touchend", e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){ if(dx<0){ galIdx=(galIdx+1)%GALLERY.length; renderGal(1); } else { galIdx=(galIdx-1+GALLERY.length)%GALLERY.length; renderGal(-1); } } sx=null; }, {passive:true});
  return g; }
function renderGal(){ const g=document.getElementById("gal"); if(!g) return; const it=GALLERY[galIdx]; const card=g.querySelector(".gcard"); let inner;
  if(it.intro){ inner="<div style='font-size:52px'>🎨</div><div class='gt'>"+it.title+"</div><div class='gs'>"+it.sub+"</div><div class='gc'>Tap › to meet the crew</div>"; }
  else if(it.duo){ inner="<div class='gduo'>"+it.duo.map(f=>"<img src='"+IMG+f+"' onerror=\"this.style.visibility='hidden'\">").join("")+"</div><div class='gt'>"+it.name+"</div><div class='gs'>"+it.title+"</div><div class='gc'>Bobblehead art by Ewan</div>"; }
  else if(it.group){ inner="<img class='gwide' src='"+IMG+it.img+"' onerror=\"this.style.visibility='hidden'\"><div class='gt'>"+it.name+"</div><div class='gs'>"+it.title+"</div><div class='gc'>The whole gang 💛</div>"; }
  else { inner="<img src='"+IMG+it.img+"' alt='"+it.name+"' onerror=\"this.style.visibility='hidden'\"><div class='gt'>"+it.name+"</div><div class='gs'>"+it.title+"</div><div class='gc'>Bobblehead art by Ewan</div>"; }
  card.innerHTML=inner; card.classList.remove("anim"); void card.offsetWidth; card.classList.add("anim");
  g.querySelector(".gdots").innerHTML = GALLERY.map((x,i)=>"<div class='gdot"+(i===galIdx?" on":"")+"'></div>").join(""); }
function openGallery(){ let g=document.getElementById("gal"); if(!g){ g=buildGallery(); document.body.appendChild(g); } galIdx=0; renderGal(); requestAnimationFrame(()=>g.classList.add("on")); cancelAuto=true; removeMoreHint(); }
function closeGallery(){ const g=document.getElementById("gal"); if(g) g.classList.remove("on"); }
function addGalleryButton(){ const host=document.getElementById("replaywrap"); if(!host || document.getElementById("galBtn")) return; const b=$("<button id='galBtn' class='btn galbtn'>🎭 Bobblehead Gallery — thanks, Ewan</button>"); host.appendChild(b); b.addEventListener("click", openGallery, {passive:true}); }

/* ---------- views ---------- */
let STATE=null, seq=0;
function render(){ STATE=compute(); app.innerHTML=""; beamsOn(false); raysOn(false); sparkleOn=false; flashOn=false; stopSpeak(); cancelAuto=true; removeMoreHint(); closeGallery(); document.querySelectorAll(".intro").forEach(e=>e.remove()); stopPad();
  if(STATE.complete && (RESULTS_VERIFIED||REHEARSE)) renderReady(); else if(STATE.complete) renderPending(); else renderPreview(); }
function header(){ return "<div class='trophy'>\u{1F3C6}</div><div class='kicker'>Family World Cup 2026</div>"+
  "<h1>The Celebration Podium</h1><div class='sub'>MetLife Stadium · Sunday, July 19, 2026</div>"; }
function renderReady(){ app.appendChild($("<div class='fade-in'>"+header()+
  "<div class='sub' style='margin-top:14px'>All results are in and the standings are final.</div>"+
  "<button id='go' class='btn big'>✨ Reveal the Champions ✨</button>"+
  "<div class='note'>Tap when the whole family is watching. Turn your volume up. \u{1F50A}</div></div>"));
  document.getElementById("go").addEventListener("click", startReveal, {passive:true}); }
function renderPreview(){ app.appendChild($("<div class='fade-in'>"+header()+
  "<div class='lock'>\u{1F512} Locked until the final is played &amp; verified</div>"+
  "<span class='badgechip'>Preview mode — final not scored yet</span>"+
  "<div style='margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center'>"+
    "<button id='prev' class='btn'>▶ Preview the ceremony</button>"+
    "<button id='sim' class='btn ghost'>\u{1F3AC} Demo with a sample final</button></div>"+
  "<div class='note'>Preview uses the current live standings so you can test the reveal, music and effects right now. On final day this unlocks the real ceremony automatically once the score is in. <b>Demo</b> plugs in a sample result (Spain beat Argentina) so you can see the podium bonuses reshuffle the order.</div></div>"));
  document.getElementById("prev").addEventListener("click", ()=>startReveal(), {passive:true});
  document.getElementById("sim").addEventListener("click", ()=>{ DATA.finalResult=[2,1]; DATA.thirdResult=[2,1]; render(); }, {passive:true}); }

function renderPending(){ app.appendChild($("<div class='fade-in'>"+header()+
  "<div class='lock'>\u{1F512} The results are in!</div>"+
  "<span class='badgechip'>Champions being verified</span>"+
  "<div class='note' style='margin-top:16px'>The final whistle has blown and every point is being double-checked. The official Celebration Podium reveal is coming very soon \u2014 check back shortly! \u{1F3C6}</div></div>")); }
function podiumScaffold(){ return $("<div class='fade-in'>"+header()+
  "<div id='trophyslot'></div>"+"<div class='stage-title' id='stitle'>&nbsp;</div>"+
  "<div class='podium' id='pod'><div class='col' id='c-silver'></div><div class='col' id='c-gold'></div><div class='col' id='c-bronze'></div></div>"+
  "<div id='ribbonwrap'></div><div id='rest'></div><div id='awrap'></div><div id='replaywrap'></div>"+
  "<div class='foot'>Family World Cup 2026 — thanks for playing, everyone ❤️</div></div>"); }
function colHTML(p,place){ const cls=place===1?"g":place===2?"s":"b"; const plinth=place===1?"p1":place===2?"p2":"p3";
  const medal=place===1?"\u{1F3C6}":place===2?"\u{1F948}":"\u{1F949}"; const crown=place===1?"<div class='crown'>\u{1F451}</div>":"";
  return "<div class='who'><div class='avwrap'>"+crown+imgTag(p,"av "+cls)+"</div><div class='nm2'>"+p.name+"</div>"+
    "<div class='pts2'><span class='cnt'>0</span><small>pts</small></div></div><div class='plinth "+plinth+"'><span class='medal'>"+medal+"</span></div>"; }
function placeCol(id,p,place){ const col=document.getElementById(id); if(!col) return; col.innerHTML=colHTML(p,place); void col.offsetWidth; col.classList.add("in"); slotRoll(col.querySelector(".cnt"),p.total,place===1?1700:1100); }
function setTitle(h){ const t=document.getElementById("stitle"); if(t) t.innerHTML=h; }

async function showCountdown(){ const layer=$("<div class='countdown'><div class='num'>3</div></div>"); document.body.appendChild(layer);
  const el=layer.querySelector(".num"); for(const n of ["3","2","1"]){ el.textContent=n; el.style.animation="none"; void el.offsetWidth; el.style.animation="pop .95s ease-out"; timpani(120,0,0.6); buzz(40); await sleep(950); } layer.remove(); }

async function startReveal(){
  const my=++seq; ensureAudio(); addSkip(); addMute(); addAnnouncer(); app.innerHTML=""; app.appendChild(podiumScaffold());
  try{ if('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); }catch(e){}
  sparkleOn=true; flashOn=true; startPad();
  const ranked=STATE.ranked, awards=buildAwards(ranked);
  setChampionTheme();
  await lightsOn(); if(my!==seq) return;
  if(my!==seq) return; await sleep(500); if(my!==seq) return;
  setTitle("Ladies and gentlemen…"); drumroll(1.1); timpani(90,0,0.5); buzz(60); await say("intro","Ladies and gentlemen!"); if(my!==seq) return; await sleep(500); if(my!==seq) return;
  setTitle("Your <span class='em'>2026 Family World Cup</span> finishes…"); await sleep(1400); if(my!==seq) return;

  setTitle("In <span class='em'>third place</span>…"); await sleep(700); if(my!==seq) return;
  await say("third","In third place...",ranked[2].name, ()=>{ placeCol("c-bronze",ranked[2],3); walkSting(3); chime(523); confetti(40); buzz(80); }); if(my!==seq) return; await sleep(900); if(my!==seq) return;

  setTitle("In <span class='em'>second place</span>…"); await sleep(700); if(my!==seq) return;
  await say("second","In second place...",ranked[1].name, ()=>{ placeCol("c-silver",ranked[1],2); walkSting(2); chime(659); confetti(70); buzz([60,40,60]); }); if(my!==seq) return; await sleep(1000); if(my!==seq) return;

  setTitle("And your <span class='em'>Family World Cup Champion</span> is…"); riser(2.6); drumroll(2.6); trophyRise(); await sleep(1200); if(my!==seq) return;
  await showCountdown(); if(my!==seq) return;

  await say("champion","And your Family World Cup champion is...",ranked[0].name, ()=>{
    placeCol("c-gold",ranked[0],1); const gc=document.getElementById("c-gold"); if(gc) gc.classList.add("glow");
    championTheme(); bloomFlash(); raysOn(true); screenShake(); confetti(240); confettiStream(9000); fireworksShow(9000); buzz([120,60,120,60,220]);
    setTitle("\u{1F451} "+ranked[0].name+" — Champion of the World! \u{1F451}");
    const rib=document.getElementById("ribbonwrap"); if(rib){ rib.innerHTML="<span class='ribbon'>C H A M P I O N</span>"; setTimeout(()=>{ const r=rib.querySelector(".ribbon"); if(r) r.classList.add("in"); },300); }
  }); if(my!==seq) return;
  await sleep(2600); if(my!==seq) return;

  showMoreHint(); renderRest(ranked); await sleep(700); if(my!==seq) return;
  renderAwards(awards,ranked);
  await sleep(400); showReplay(); addGalleryButton(); removeSkip();
  setTimeout(()=>{ if(seq===my) startAutoScroll(); }, 900);
  setTimeout(()=>{ sparkleOn=false; flashOn=false; stopPad(); beamsOn(false); raysOn(false); }, 6000);
}

function renderRest(ranked){ const host=document.getElementById("rest"); if(!host) return;
  host.innerHTML="<div class='section-h'>Final Standings</div><div class='lb' id='lb'></div>"; const lb=document.getElementById("lb");
  ranked.forEach((p,i)=>{ const mv=p.climb>0?"<span class='mv up'>▲"+p.climb+"</span>":p.climb<0?"<span class='mv down'>▼"+(-p.climb)+"</span>":"<span class='mv same'>▬</span>";
    const bonus=p.bonus>0?" · <b style='color:var(--gold)'>+"+p.bonus+" bonus</b>":"";
    const row=$("<div class='row"+(p.rank<=3?" top":"")+"'><div class='rk'>"+(p.rank===1?"\u{1F3C6}":p.rank)+"</div>"+imgTag(p,"ava")+
      "<div class='nmw'><div class='n'>"+p.name+"</div><div class='m'>"+p.exact+" exact · "+p.correct+" correct"+bonus+"</div></div>"+
      "<div class='tot'>"+mv+p.total+"<small> pts</small></div></div>");
    lb.appendChild(row); setTimeout(()=>{ row.classList.add("in"); if(i<6) voice(440+i*40,0,0.25,"triangle",0.12,0.01,SFX); },120*i); }); }

function renderAwards(awards,ranked){ const host=document.getElementById("awrap"); if(!host) return;
  host.innerHTML="<div class='section-h'>\u{1F3C5} Family Awards — one for everyone</div><div class='awards' id='aw'></div>"; const wrap=document.getElementById("aw");
  ranked.map(p=>p.name).forEach((name,i)=>{ const a=awards[name]; if(!a) return;
    const card=$("<div class='aw'><div class='em'>"+a.em+"</div><div class='ti'>"+a.ti+"</div>"+
      "<div class='who3'>"+imgTag(a.player,"")+"<span class='nn'>"+name+"</span></div>"+
      "<div class='de'>"+a.de+"</div><div class='de' style='color:var(--gold)'>"+a.sub+"</div></div>");
    wrap.appendChild(card); setTimeout(()=>{ card.classList.add("in"); chime(520+i*26); confetti(10); },260*i+200); }); }

function showReplay(){ const host=document.getElementById("replaywrap"); if(!host) return;
  host.innerHTML="<button id='replay' class='btn ghost' style='margin-top:26px'>\u{1F504} Play it again</button>";
  document.getElementById("replay").addEventListener("click", ()=>{ stopSpeak(); P=[]; confUntil=0; render(); scrollTo(0,0); }, {passive:true}); }

function addMute(){ if(document.getElementById("muteBtn")) return; const b=$("<button id='muteBtn' class='mute'>"+(muted?"\u{1F507}":"\u{1F50A}")+"</button>");
  document.body.appendChild(b); b.addEventListener("click", toggleMute, {passive:true}); }
function addSkip(){ if(document.getElementById("skipbtn")) return; const b=$("<div class='skip'><button id='skipbtn' class='btn ghost'>Skip ⏭</button></div>");
  document.body.appendChild(b); document.getElementById("skipbtn").addEventListener("click", ()=>{ seq++; P=[]; confUntil=0; sparkleOn=false; flashOn=false; stopPad(); stopSpeak(); raysOn(false); cancelAuto=true; removeMoreHint(); closeGallery(); document.querySelectorAll(".countdown,.intro").forEach(e=>e.remove()); renderFull(); removeSkip(); }, {passive:true}); }
function removeSkip(){ const s=document.querySelector(".skip"); if(s) s.remove(); }

function renderFull(){ app.innerHTML=""; app.appendChild(podiumScaffold()); beamsOn(true);
  const ranked=STATE.ranked, awards=buildAwards(ranked);
  document.getElementById("c-gold").innerHTML=colHTML(ranked[0],1); document.getElementById("c-gold").classList.add("in","glow");
  document.getElementById("c-silver").innerHTML=colHTML(ranked[1],2); document.getElementById("c-silver").classList.add("in");
  document.getElementById("c-bronze").innerHTML=colHTML(ranked[2],3); document.getElementById("c-bronze").classList.add("in");
  [["c-gold",0],["c-silver",1],["c-bronze",2]].forEach(([id,ix])=>{ const c=document.getElementById(id); c.querySelector(".cnt").textContent=ranked[ix].total; });
  setTitle("\u{1F451} "+ranked[0].name+" — Champion! \u{1F451}"); raysOn(true); trophyRise();
  const rib=document.getElementById("ribbonwrap"); if(rib){ rib.innerHTML="<span class='ribbon in'>C H A M P I O N</span>"; }
  renderRest(ranked); document.querySelectorAll(".row").forEach(r=>r.classList.add("in"));
  renderAwards(awards,ranked); setTimeout(()=>document.querySelectorAll(".aw").forEach(a=>a.classList.add("in")),50);
  showReplay(); addGalleryButton(); setTimeout(()=>beamsOn(false), 4000); }

render();
</script>
</body>
</html>
