<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family World Cup 2026 - Celebration Podium</title>
<style>
  :root{
    --gold:#ffd23f; --gold2:#ffb300; --silver:#d8e0ea; --bronze:#e08a4a;
    --bg0:#05070f; --bg1:#0d1633; --ink:#f4f7ff; --dim:#9fb0d0;
    --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg0);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow-x:hidden}
  body{min-height:100dvh; position:relative;
    background:
      radial-gradient(120vw 80vh at 50% -20%, #1b2a63 0%, rgba(27,42,99,0) 55%),
      radial-gradient(90vw 60vh at 15% 10%, rgba(255,210,63,.10) 0%, rgba(0,0,0,0) 50%),
      radial-gradient(90vw 60vh at 85% 10%, rgba(120,180,255,.12) 0%, rgba(0,0,0,0) 50%),
      linear-gradient(180deg,var(--bg1) 0%, var(--bg0) 70%)}
  canvas#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:60}
  .wrap{position:relative; z-index:2; max-width:820px; margin:0 auto; padding:22px 16px 90px; text-align:center}
  .kicker{letter-spacing:.32em; font-size:12px; color:var(--gold); font-weight:800; text-transform:uppercase; margin:6px 0 2px}
  h1{font-size:clamp(26px,7vw,46px); line-height:1.02; margin:.1em 0 .05em; font-weight:900;
     background:linear-gradient(180deg,#fff, #ffe89a 60%, var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent;
     text-shadow:0 2px 30px rgba(255,200,60,.15)}
  .sub{color:var(--dim); font-size:14px; margin-top:6px}
  .trophy{font-size:64px; filter:drop-shadow(0 8px 26px rgba(255,190,60,.5)); animation:float 3.4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .btn{display:inline-flex; align-items:center; gap:10px; border:none; cursor:pointer;
    font-weight:900; font-size:19px; letter-spacing:.02em; color:#241a00;
    padding:18px 30px; border-radius:999px; margin-top:22px; min-height:60px;
    background:linear-gradient(180deg,#ffe27a,var(--gold2));
    box-shadow:0 10px 30px rgba(255,180,40,.45), inset 0 1px 0 rgba(255,255,255,.6);
    touch-action:manipulation; user-select:none; transition:transform .12s ease}
  .btn:active{transform:scale(.96)}
  .btn.big{font-size:22px; padding:22px 34px; animation:pulse 2.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 10px 30px rgba(255,180,40,.45), inset 0 1px 0 rgba(255,255,255,.6)}
    50%{box-shadow:0 14px 44px rgba(255,200,70,.75), inset 0 1px 0 rgba(255,255,255,.7)}}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);
    box-shadow:none; font-size:15px; padding:13px 20px; min-height:0}
  .note{margin-top:16px; color:var(--dim); font-size:13px; line-height:1.5; max-width:520px; margin-left:auto; margin-right:auto}
  .lock{font-size:15px; color:var(--gold); font-weight:800; margin-top:14px}
  .badgechip{display:inline-block; margin-top:10px; padding:6px 12px; border-radius:999px; font-size:12px; font-weight:800;
    background:rgba(255,210,63,.14); color:var(--gold); border:1px solid rgba(255,210,63,.35)}

  /* Podium */
  .podium{display:flex; justify-content:center; align-items:flex-end; gap:10px; margin:26px auto 4px; min-height:300px; max-width:560px}
  .col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; opacity:0; transform:translateY(40px)}
  .col.in{opacity:1; transform:translateY(0); transition:opacity .5s ease, transform .6s cubic-bezier(.2,1.2,.3,1)}
  .who{display:flex; flex-direction:column; align-items:center; margin-bottom:8px}
  .av{width:78px; height:78px; border-radius:50%; object-fit:cover; background:#0b1330;
    border:3px solid var(--line); box-shadow:0 8px 22px rgba(0,0,0,.5)}
  .av.g{border-color:var(--gold); width:96px; height:96px; box-shadow:0 0 0 4px rgba(255,210,63,.25),0 10px 30px rgba(255,180,40,.5)}
  .av.s{border-color:var(--silver)} .av.b{border-color:var(--bronze)}
  .avwrap{position:relative} .crown{position:absolute; top:-26px; left:50%; transform:translateX(-50%); font-size:30px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
  .nm2{font-weight:900; margin-top:8px; font-size:16px}
  .pts2{font-weight:900; font-size:20px; color:var(--gold)} .pts2 small{font-size:11px; color:var(--dim); font-weight:700; margin-left:2px}
  .plinth{width:100%; border-radius:12px 12px 0 0; display:flex; align-items:flex-start; justify-content:center; padding-top:10px;
    font-size:34px; font-weight:900; color:rgba(0,0,0,.5); position:relative; overflow:hidden}
  .plinth::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%)}
  .p1{height:150px; background:linear-gradient(180deg,#ffe27a,var(--gold2))}
  .p2{height:112px; background:linear-gradient(180deg,#eef3fb,#aab7cc)}
  .p3{height:84px; background:linear-gradient(180deg,#f0b483,var(--bronze))}
  .medal{font-size:22px}

  .stage-title{min-height:34px; font-size:clamp(18px,5vw,26px); font-weight:900; margin:6px 0 2px; letter-spacing:.01em}
  .stage-title .em{color:var(--gold)}

  /* leaderboard */
  .section-h{margin:30px 0 12px; font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--gold); font-weight:800}
  .lb{display:flex; flex-direction:column; gap:8px; max-width:560px; margin:0 auto; text-align:left}
  .row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:10px 12px; opacity:0; transform:translateX(-14px)}
  .row.in{opacity:1; transform:none; transition:all .45s ease}
  .row.top{border-color:rgba(255,210,63,.5); background:linear-gradient(90deg,rgba(255,210,63,.12),var(--card))}
  .rk{width:30px; text-align:center; font-weight:900; font-size:17px; color:var(--dim); flex:none}
  .ava{width:38px; height:38px; border-radius:50%; object-fit:cover; background:#0b1330; border:2px solid var(--line); flex:none}
  .nmw{flex:1; min-width:0}
  .nmw .n{font-weight:800; font-size:16px}
  .nmw .m{font-size:11.5px; color:var(--dim); margin-top:1px}
  .tot{font-weight:900; font-size:19px; color:var(--gold); flex:none}
  .tot small{font-size:10px; color:var(--dim); font-weight:700}
  .mv{font-size:11px; font-weight:800; margin-right:6px}
  .mv.up{color:#4ade80}.mv.down{color:#f87171}.mv.same{color:#7f8db0}

  /* awards */
  .awards{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; max-width:600px; margin:0 auto}
  .aw{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 12px; text-align:center;
    opacity:0; transform:scale(.7); }
  .aw.in{opacity:1; transform:scale(1); transition:all .5s cubic-bezier(.2,1.4,.3,1)}
  .aw .em{font-size:30px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
  .aw .ti{font-weight:900; font-size:13.5px; margin-top:6px; color:var(--gold)}
  .aw .who3{display:flex; align-items:center; justify-content:center; gap:7px; margin-top:8px}
  .aw .who3 img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--line);background:#0b1330}
  .aw .who3 .nn{font-weight:800; font-size:14px}
  .aw .de{font-size:11px; color:var(--dim); margin-top:5px}

  .skip{position:fixed; top:calc(10px + env(safe-area-inset-top)); right:12px; z-index:70}
  .fade-in{animation:fadein .6s ease both}
  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .foot{margin-top:34px; color:var(--dim); font-size:12px}
  .hidden{display:none !important}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="wrap"><div id="app"></div></div>

<script>
const DATA = {"generated": "2026-07-18", "photos": {"Nonno": "nonno-bobblehead.jpg", "Emrys": "emrys-bobblehead.jpg", "Nana": "nana-bobblehead.jpg", "Nonna": "nonna-bobblehead.jpg", "Boompa": "boompa-bobblehead.jpg", "Autumn": "autumn-bobblehead.jpg", "River": "river-bobblehead.jpg", "Xavier": "xavier-bobblehead.jpg", "Ewan": "ewan-bobblehead.jpg"}, "prevRanks": {"date": "2026-07-17", "ranks": {"Nana": 1, "River": 2, "Nonno": 3, "Ewan": 4, "Nonna": 5, "Boompa": 6, "Autumn": 7, "Emrys": 8, "Xavier": 9}}, "ranksToday": {"date": "2026-07-18", "ranks": {"Nana": 1, "River": 2, "Nonno": 3, "Ewan": 4, "Nonna": 5, "Boompa": 6, "Autumn": 7, "Emrys": 8, "Xavier": 9}}, "finalResult": null, "thirdResult": null, "finalAdv": null, "thirdAdv": null, "standings": [{"name": "Ewan", "matchPts": 324, "exact": 12, "correct": 61, "champ": "France", "podium": {"champ": "France", "run": "Argentina", "third": "Spain", "fourth": "England"}, "goldenBoot": {"pick1": "Lionel Messi", "pick2": "Kylian Mbappé", "pick3": "Erling Haaland"}, "gbPts": 0, "photo": "ewan-bobblehead.jpg", "nPicks": 100}, {"name": "Nana", "matchPts": 346, "exact": 10, "correct": 63, "champ": "France", "podium": {"champ": "France", "run": "Argentina", "third": "England", "fourth": "Spain"}, "goldenBoot": {"pick1": "Kylian Mbappé", "pick2": "Lionel Messi", "pick3": "Harry Kane"}, "gbPts": 0, "photo": "nana-bobblehead.jpg", "nPicks": 104}, {"name": "Emrys", "matchPts": 187, "exact": 4, "correct": 25, "champ": "Argentina", "podium": {"champ": "Argentina", "run": "Belgium", "third": "USA", "fourth": "France"}, "goldenBoot": {"pick1": "Lionel Messi", "pick2": "Kylian Mbappé", "pick3": "Erling Haaland"}, "gbPts": 0, "photo": "emrys-bobblehead.jpg", "nPicks": 50}, {"name": "Nonno", "matchPts": 334, "exact": 12, "correct": 67, "champ": "Belgium", "podium": {"champ": "Belgium", "run": "Argentina", "third": "France", "fourth": "Norway"}, "goldenBoot": {"pick1": "Lionel Messi", "pick2": "Kylian Mbappé", "pick3": "Erling Haaland"}, "gbPts": 0, "photo": "nonno-bobblehead.jpg", "nPicks": 104}, {"name": "Nonna", "matchPts": 272, "exact": 9, "correct": 48, "champ": "Belgium", "podium": {"champ": "Belgium", "run": "Norway", "third": "Argentina", "fourth": "France"}, "goldenBoot": {"pick1": "Kylian Mbappé", "pick2": "Lionel Messi", "pick3": "Romelu Lukaku"}, "gbPts": 0, "photo": "nonna-bobblehead.jpg", "nPicks": 98}, {"name": "Boompa", "matchPts": 252, "exact": 6, "correct": 49, "champ": "Argentina", "podium": {"champ": "Argentina", "run": "Belgium", "third": "France", "fourth": "Brazil"}, "goldenBoot": {"pick1": "Lionel Messi", "pick2": "Erling Haaland", "pick3": "Cristiano Ronaldo"}, "gbPts": 0, "photo": "boompa-bobblehead.jpg", "nPicks": 100}, {"name": "Xavier", "matchPts": 125, "exact": 6, "correct": 22, "champ": "USA", "podium": {"champ": "USA", "run": "Argentina", "third": "France", "fourth": "Cape Verde"}, "goldenBoot": {"pick1": "Lionel Messi", "pick2": "Kylian Mbappé", "pick3": "Erling Haaland"}, "gbPts": 0, "photo": "xavier-bobblehead.jpg", "nPicks": 33}, {"name": "Autumn", "matchPts": 224, "exact": 6, "correct": 44, "champ": "France", "podium": {"champ": "France", "run": "Spain", "third": "Argentina", "fourth": "USA"}, "goldenBoot": {"pick1": "Lionel Messi", "pick2": "Ousmane Dembélé", "pick3": "Erling Haaland"}, "gbPts": 0, "photo": "autumn-bobblehead.jpg", "nPicks": 74}, {"name": "River", "matchPts": 338, "exact": 11, "correct": 63, "champ": "England", "podium": {"champ": "England", "run": "USA", "third": "Netherlands", "fourth": "Belgium"}, "goldenBoot": {"pick1": "Harry Kane", "pick2": "Erling Haaland", "pick3": "Kylian Mbappé"}, "gbPts": 0, "photo": "river-bobblehead.jpg", "nPicks": 99}]};
const IMG = "https://family-worldcup-2026.pages.dev/";
const FINAL = {h:"Spain", a:"Argentina"};
const THIRD = {h:"France", a:"England"};

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const $ = (h)=>{const d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild;};
const sleep = (ms)=> new Promise(r=>setTimeout(r,ms));
function avatarSrc(p){ const f = p.photo || (DATA.photos && DATA.photos[p.name]); return f? (IMG+f) : ""; }
function imgTag(p, cls){
  const src = avatarSrc(p);
  const init = (p.name||"?").slice(0,1);
  const fb = "this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:this.className+' fbk',textContent:'"+init+"'}));this.parentNode&&0;";
  if(!src){ return "<div class='"+cls+" fbk' style='display:flex;align-items:center;justify-content:center;font-weight:900'>"+init+"</div>"; }
  return "<img class='"+cls+"' src='"+src+"' alt='"+p.name+"' onerror=\""+fb+"\">";
}

/* ---------- scoring (mirrors the app: total = matchPts + podium bonus) ---------- */
function outcome(score, teams, adv){
  if(!score) return null;
  const h=score[0], a=score[1];
  if(h>a) return {winner:teams.h, loser:teams.a};
  if(a>h) return {winner:teams.a, loser:teams.h};
  if(adv==="H") return {winner:teams.h, loser:teams.a};
  if(adv==="A") return {winner:teams.a, loser:teams.h};
  return null; // level, shootout winner not set yet
}
function finalFour(){
  const f = outcome(DATA.finalResult, FINAL, DATA.finalAdv);
  const t = outcome(DATA.thirdResult, THIRD, DATA.thirdAdv);
  return {
    champion: f? f.winner:null, runnerup: f? f.loser:null,
    third: t? t.winner:null, fourth: t? t.loser:null
  };
}
function podiumBonus(p, ff){
  let b=0; const pod=p.podium||{};
  if(ff.champion && p.champ===ff.champion) b+=50;
  if(ff.runnerup && pod.run===ff.runnerup) b+=35;
  if(ff.third && pod.third===ff.third) b+=20;
  if(ff.fourth && pod.fourth===ff.fourth) b+=10;
  return b;
}
function climbOf(name){
  try{ const pr=DATA.prevRanks.ranks[name], tr=DATA.ranksToday.ranks[name]; return (pr!=null&&tr!=null)? (pr-tr):0; }catch(e){ return 0; }
}
function compute(){
  const ff = finalFour();
  let s = DATA.standings.map(p=>{
    const bonus = podiumBonus(p, ff);
    return Object.assign({}, p, {bonus:bonus, total:(p.matchPts||0)+bonus, climb:climbOf(p.name)});
  });
  s.sort((a,b)=> b.total-a.total || b.exact-a.exact || b.correct-a.correct || a.name.localeCompare(b.name));
  let rank=1; s.forEach((x,i)=>{ if(i>0 && x.total<s[i-1].total) rank=i+1; x.rank=rank; });
  return {ranked:s, ff:ff, complete: ff.champion!=null};
}

/* ---------- awards: guarantee every player gets one ---------- */
const CATS = [
  {key:"oracle",  em:"\u{1F52E}", ti:"The Oracle",        de:"Best podium bonus",        val:p=>p.bonus,  fmt:p=>"+"+p.bonus+" bonus"},
  {key:"sharp",   em:"\u{1F3AF}", ti:"Sharpshooter",       de:"Most exact scorelines",    val:p=>p.exact,  fmt:p=>p.exact+" exact"},
  {key:"analyst", em:"✅",     ti:"The Analyst",        de:"Most correct outcomes",    val:p=>p.correct,fmt:p=>p.correct+" correct"},
  {key:"guru",    em:"⚽",     ti:"Golden Boot Guru",   de:"Top-scorer points",        val:p=>p.gbPts||0,fmt:p=>(p.gbPts||0)+" GB pts"},
  {key:"climber", em:"\u{1F4C8}", ti:"Biggest Climber",    de:"Rose the most lately",     val:p=>p.climb,  fmt:p=>"up "+p.climb+" spots"},
  {key:"prolific",em:"\u{1F3B2}", ti:"The Gambler",        de:"Most predictions made",    val:p=>p.nPicks, fmt:p=>p.nPicks+" picks"},
  {key:"eff",     em:"\u{1F48E}", ti:"Efficiency Expert",  de:"Best points per pick",     val:p=>p.nPicks>=5?(p.matchPts/p.nPicks):0, fmt:p=>(p.matchPts/Math.max(1,p.nPicks)).toFixed(1)+" pts/pick"},
];
const FALLBACK = [
  {em:"\u{1F31F}", ti:"Heart of the Tournament", de:"Kept everyone smiling"},
  {em:"\u{1F981}", ti:"Boldest Predictor",       de:"Never played it safe"},
  {em:"\u{1F3AA}", ti:"Most Entertaining Picks", de:"The wildcard we love"},
  {em:"\u{1F525}", ti:"Never Gave Up",           de:"Fought to the whistle"},
  {em:"\u{1F9ED}", ti:"The Wildcard",            de:"Full of surprises"},
  {em:"\u{1F389}", ti:"MVP Superfan",            de:"Heart and soul of it all"},
];
function buildAwards(ranked){
  const out = {}; // name -> award
  const medals = [
    {em:"\u{1F3C6}", ti:"World Champion", de:"1st overall", fmt:p=>p.total+" pts"},
    {em:"\u{1F948}", ti:"Runner-Up",      de:"2nd overall", fmt:p=>p.total+" pts"},
    {em:"\u{1F949}", ti:"Third Place",    de:"3rd overall", fmt:p=>p.total+" pts"},
  ];
  ranked.slice(0,3).forEach((p,i)=>{ out[p.name]={em:medals[i].em, ti:medals[i].ti, de:medals[i].de, sub:medals[i].fmt(p), player:p}; });

  const rest = ranked.slice(3).map(p=>p.name);
  const usedCats = new Set();
  // greedily assign each remaining player their most standout category
  const remaining = new Set(rest);
  while(remaining.size){
    let best=null;
    remaining.forEach(name=>{
      const p = ranked.find(x=>x.name===name);
      CATS.forEach(c=>{
        if(usedCats.has(c.key)) return;
        const v = c.val(p); if(v<=0) return;
        const fieldMax = Math.max.apply(null, ranked.map(x=>c.val(x)));
        const standout = fieldMax>0 ? v/fieldMax : 0;
        // require the player be the top remaining for that cat to feel earned
        const topRemainingVal = Math.max.apply(null, [...remaining].map(n=>c.val(ranked.find(x=>x.name===n))));
        if(v<topRemainingVal) return;
        if(!best || standout>best.standout){ best={name,cat:c,standout,p}; }
      });
    });
    if(!best) break;
    out[best.name]={em:best.cat.em, ti:best.cat.ti, de:best.cat.de, sub:best.cat.fmt(best.p), player:best.p};
    usedCats.add(best.cat.key); remaining.delete(best.name);
  }
  // anyone still unassigned -> fun fallback
  let fi=0;
  remaining.forEach(name=>{ const p=ranked.find(x=>x.name===name); const f=FALLBACK[fi++%FALLBACK.length];
    out[name]={em:f.em, ti:f.ti, de:f.de, sub:p.total+" pts", player:p}; });
  return out;
}

/* ---------- audio (synth, no files -> can't fail to load) ---------- */
let AC=null, MASTER=null;
function ensureAudio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); MASTER=AC.createGain(); MASTER.gain.value=0.9; MASTER.connect(AC.destination);}catch(e){ AC=null; } }
  if(AC && AC.state==="suspended"){ AC.resume(); }
  return AC;
}
function tone(freq, t0, dur, type, vol){
  if(!AC) return; const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"triangle"; o.frequency.value=freq;
  const s=AC.currentTime+t0;
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol||0.3, s+0.02);
  g.gain.exponentialRampToValueAtTime(0.0005, s+dur);
  o.connect(g); g.connect(MASTER); o.start(s); o.stop(s+dur+0.05);
}
function noise(t0, dur, vol, freq, q){
  if(!AC) return; const n=AC.createBufferSource();
  const buf=AC.createBuffer(1, AC.sampleRate*Math.max(0.05,dur), AC.sampleRate);
  const dt=buf.getChannelData(0); for(let i=0;i<dt.length;i++) dt[i]=Math.random()*2-1;
  n.buffer=buf; const bp=AC.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq||900; bp.Q.value=q||0.8;
  const g=AC.createGain(); const s=AC.currentTime+t0;
  g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(vol||0.3,s+dur*0.3); g.gain.exponentialRampToValueAtTime(0.0005,s+dur);
  n.connect(bp); bp.connect(g); g.connect(MASTER); n.start(s); n.stop(s+dur+0.05);
}
function chime(base){ ensureAudio(); tone(base,0,0.5,"triangle",0.3); tone(base*1.5,0.04,0.5,"triangle",0.2); }
function drumroll(dur){ ensureAudio(); noise(0,dur,0.25,180,0.6); }
function crowd(){ ensureAudio(); noise(0,2.4,0.35,700,0.5); noise(0.1,2.2,0.2,1600,0.4); }
function fanfare(){ ensureAudio(); const seq=[523.25,659.25,783.99,1046.5]; seq.forEach((f,i)=>tone(f,0.12*i,0.9,"sawtooth",0.28));
  tone(1046.5,0.5,1.4,"triangle",0.3); tone(1318.5,0.5,1.4,"triangle",0.22); }

/* ---------- confetti + fireworks ---------- */
const cv=document.getElementById("fx"), cx=cv.getContext("2d");
let P=[], W=0, H=0;
function resize(){ W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio; }
resize(); addEventListener("resize", resize);
const COLORS=["#ffd23f","#ffb300","#4ade80","#60a5fa","#f472b6","#ffffff","#f87171"];
function confetti(n){ n=n||160; for(let i=0;i<n;i++){ P.push({x:Math.random()*W, y:-20*devicePixelRatio, vx:(Math.random()-.5)*6*devicePixelRatio, vy:(Math.random()*3+2)*devicePixelRatio, g:0.12*devicePixelRatio, s:(Math.random()*7+4)*devicePixelRatio, c:COLORS[Math.random()*COLORS.length|0], rot:Math.random()*6.28, vr:(Math.random()-.5)*.3, life:1, t:"c"}); } }
function firework(x,y){ const c=COLORS[Math.random()*COLORS.length|0]; for(let i=0;i<46;i++){ const a=Math.random()*6.28, sp=(Math.random()*4+2)*devicePixelRatio; P.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:0.045*devicePixelRatio,s:3*devicePixelRatio,c:c,life:1,fade:0.016,t:"f"}); } }
function fireworksShow(){ let k=0; const iv=setInterval(()=>{ firework((0.2+Math.random()*0.6)*W,(0.15+Math.random()*0.35)*H); if(++k>6) clearInterval(iv); },420); }
function loop(){ cx.clearRect(0,0,W,H);
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy;
    if(p.t==="c"){ p.rot+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cx.restore();
      if(p.y>H+30){ P.splice(i,1); } }
    else { p.life-=p.fade; if(p.life<=0){ P.splice(i,1); continue; } cx.globalAlpha=Math.max(0,p.life); cx.fillStyle=p.c; cx.beginPath(); cx.arc(p.x,p.y,p.s,0,6.28); cx.fill(); cx.globalAlpha=1; } }
  requestAnimationFrame(loop);
}
loop();

/* ---------- count up ---------- */
function countUp(el, to, dur){ to=Math.round(to); let st=null; const ease=t=>1-Math.pow(1-t,3);
  function f(t){ if(st===null)st=t; const p=Math.min(1,(t-st)/dur); el.textContent=Math.round(to*ease(p)); if(p<1) requestAnimationFrame(f); }
  requestAnimationFrame(f); }

/* ---------- views ---------- */
let STATE=null, seq=0;

function render(){
  STATE = compute();
  app.innerHTML="";
  if(STATE.complete){ renderReady(); }
  else { renderPreview(); }
}

function header(titleLock){
  return "<div class='trophy'>\u{1F3C6}</div>"+
    "<div class='kicker'>Family World Cup 2026</div>"+
    "<h1>The Celebration Podium</h1>"+
    "<div class='sub'>MetLife Stadium · Sunday, July 19, 2026</div>";
}

function renderReady(){
  app.appendChild($(
    "<div class='fade-in'>"+ header() +
    "<div class='sub' style='margin-top:14px'>All results are in and the standings are final.</div>"+
    "<button id='go' class='btn big'>✨ Reveal the Champions ✨</button>"+
    "<div class='note'>Tap when the whole family is watching. Turn your volume up.</div>"+
    "</div>"));
  document.getElementById("go").addEventListener("click", startReveal, {passive:true});
}

function renderPreview(){
  app.appendChild($(
    "<div class='fade-in'>"+ header() +
    "<div class='lock'>\u{1F512} Locked until the final is played &amp; verified</div>"+
    "<span class='badgechip'>Preview mode — final not scored yet</span>"+
    "<div style='margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:center'>"+
      "<button id='prev' class='btn'>▶ Preview the ceremony</button>"+
      "<button id='sim' class='btn ghost'>\u{1F3AC} Demo with a sample final</button>"+
    "</div>"+
    "<div class='note'>Preview uses the current live standings so you can test the reveal, sound and animations on your phone right now. On final day this screen unlocks the real ceremony automatically once the score is in. <b>Demo</b> plugs in a sample result (Spain beat Argentina) so you can see the podium bonuses reshuffle the order.</div>"+
    "</div>"));
  document.getElementById("prev").addEventListener("click", ()=>startReveal(), {passive:true});
  document.getElementById("sim").addEventListener("click", ()=>{
    DATA.finalResult=[2,1]; DATA.thirdResult=[2,1]; render(); // now "complete"
  }, {passive:true});
}

function podiumScaffold(){
  const wrap=$("<div class='fade-in'>"+ header() +
    "<div class='stage-title' id='stitle'>&nbsp;</div>"+
    "<div class='podium' id='pod'>"+
      "<div class='col' id='c-silver'></div>"+
      "<div class='col' id='c-gold'></div>"+
      "<div class='col' id='c-bronze'></div>"+
    "</div>"+
    "<div id='rest'></div>"+
    "<div id='awrap'></div>"+
    "<div id='replaywrap'></div>"+
    "<div class='foot'>Family World Cup 2026 — thanks for playing, everyone ❤️</div>"+
    "</div>");
  return wrap;
}

function colHTML(p, place){
  const cls = place===1?"g":place===2?"s":"b";
  const plinth = place===1?"p1":place===2?"p2":"p3";
  const medal = place===1?"\u{1F3C6}":place===2?"\u{1F948}":"\u{1F949}";
  const crown = place===1?"<div class='crown'>\u{1F451}</div>":"";
  return "<div class='who'><div class='avwrap'>"+crown+ imgTag(p, "av "+cls) +"</div>"+
    "<div class='nm2'>"+p.name+"</div>"+
    "<div class='pts2'><span class='cnt'>0</span><small>pts</small></div></div>"+
    "<div class='plinth "+plinth+"'><span class='medal'>"+medal+"</span></div>";
}

async function placeCol(id, p, place){
  const col=document.getElementById(id);
  col.innerHTML=colHTML(p, place);
  void col.offsetWidth;
  col.classList.add("in");
  const cnt=col.querySelector(".cnt");
  countUp(cnt, p.total, 1100);
}

function setTitle(html){ const t=document.getElementById("stitle"); if(t) t.innerHTML=html; }

async function startReveal(){
  const my=++seq;
  ensureAudio();
  addSkip();
  app.innerHTML="";
  app.appendChild(podiumScaffold());
  const ranked=STATE.ranked, awards=buildAwards(ranked);

  if(my!==seq) return;
  await sleep(500); if(my!==seq) return;
  setTitle("Ladies and gentlemen…"); drumroll(1.1); await sleep(1500); if(my!==seq) return;
  setTitle("Your <span class='em'>2026 Family World Cup</span> finishes…"); await sleep(1400); if(my!==seq) return;

  setTitle("In <span class='em'>third place</span>…"); await sleep(1000); if(my!==seq) return;
  await placeCol("c-bronze", ranked[2], 3); chime(523); confetti(30); await sleep(1600); if(my!==seq) return;

  setTitle("In <span class='em'>second place</span>…"); await sleep(1000); if(my!==seq) return;
  await placeCol("c-silver", ranked[1], 2); chime(659); confetti(40); await sleep(1700); if(my!==seq) return;

  setTitle("And your <span class='em'>Family World Cup Champion</span> is…"); drumroll(2.0); await sleep(2100); if(my!==seq) return;
  await placeCol("c-gold", ranked[0], 1);
  fanfare(); crowd(); confetti(220); fireworksShow();
  setTitle("\u{1F451} "+ranked[0].name+" — Champion of the World! \u{1F451}");
  await sleep(2000); if(my!==seq) return;

  renderRest(ranked);
  await sleep(500); if(my!==seq) return;
  renderAwards(awards, ranked);
  showReplay();
  removeSkip();
}

function renderRest(ranked){
  const host=document.getElementById("rest"); if(!host) return;
  host.innerHTML="<div class='section-h'>Final Standings</div><div class='lb' id='lb'></div>";
  const lb=document.getElementById("lb");
  ranked.forEach((p,i)=>{
    const mv = p.climb>0?"<span class='mv up'>▲"+p.climb+"</span>":p.climb<0?"<span class='mv down'>▼"+(-p.climb)+"</span>":"<span class='mv same'>▬</span>";
    const bonus = p.bonus>0? " · <b style='color:var(--gold)'>+"+p.bonus+" bonus</b>":"";
    const row=$("<div class='row"+(p.rank<=3?" top":"")+"'>"+
      "<div class='rk'>"+(p.rank===1?"\u{1F3C6}":p.rank)+"</div>"+
      imgTag(p,"ava")+
      "<div class='nmw'><div class='n'>"+p.name+"</div>"+
        "<div class='m'>"+p.exact+" exact · "+p.correct+" correct"+bonus+"</div></div>"+
      "<div class='tot'>"+mv+p.total+"<small> pts</small></div>"+
    "</div>");
    lb.appendChild(row);
    setTimeout(()=>row.classList.add("in"), 120*i);
  });
}

function renderAwards(awards, ranked){
  const host=document.getElementById("awrap"); if(!host) return;
  host.innerHTML="<div class='section-h'>\u{1F3C5} Family Awards — one for everyone</div><div class='awards' id='aw'></div>";
  const wrap=document.getElementById("aw");
  const order = ranked.map(p=>p.name);
  order.forEach((name,i)=>{
    const a=awards[name]; if(!a) return;
    const card=$("<div class='aw'><div class='em'>"+a.em+"</div><div class='ti'>"+a.ti+"</div>"+
      "<div class='who3'>"+imgTag(a.player,"")+"<span class='nn'>"+name+"</span></div>"+
      "<div class='de'>"+a.de+"</div><div class='de' style='color:var(--gold)'>"+a.sub+"</div></div>");
    wrap.appendChild(card);
    setTimeout(()=>{ card.classList.add("in"); chime(500+ i*30); }, 260*i + 200);
  });
}

function showReplay(){
  const host=document.getElementById("replaywrap"); if(!host) return;
  host.innerHTML="<button id='replay' class='btn ghost' style='margin-top:26px'>\u{1F504} Play it again</button>";
  document.getElementById("replay").addEventListener("click", ()=>{ P=[]; render(); scrollTo(0,0); }, {passive:true});
}

function addSkip(){
  if(document.getElementById("skipbtn")) return;
  const b=$("<div class='skip'><button id='skipbtn' class='btn ghost'>Skip ⏭</button></div>");
  document.body.appendChild(b);
  document.getElementById("skipbtn").addEventListener("click", ()=>{
    seq++; // cancel running sequence
    P=[]; renderFull();
    removeSkip();
  }, {passive:true});
}
function removeSkip(){ const s=document.querySelector(".skip"); if(s) s.remove(); }

function renderFull(){
  app.innerHTML=""; app.appendChild(podiumScaffold());
  const ranked=STATE.ranked, awards=buildAwards(ranked);
  document.getElementById("c-gold").innerHTML=colHTML(ranked[0],1);
  document.getElementById("c-silver").innerHTML=colHTML(ranked[1],2);
  document.getElementById("c-bronze").innerHTML=colHTML(ranked[2],3);
  ["c-gold","c-silver","c-bronze"].forEach(id=>{ const c=document.getElementById(id); c.classList.add("in"); const cnt=c.querySelector(".cnt"); const pl=id==="c-gold"?ranked[0]:id==="c-silver"?ranked[1]:ranked[2]; cnt.textContent=pl.total; });
  setTitle("\u{1F451} "+ranked[0].name+" — Champion! \u{1F451}");
  renderRest(ranked);
  document.querySelectorAll(".row").forEach(r=>r.classList.add("in"));
  renderAwards(awards, ranked);
  setTimeout(()=>document.querySelectorAll(".aw").forEach(a=>a.classList.add("in")),50);
  showReplay();
}

render();
</script>
</body>
</html>
